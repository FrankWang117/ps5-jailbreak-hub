# 片段：合并到现有 voidbai.com HTTPS server 内。不要替换整站配置。
# 文件布局：/var/www/ps5-jailbreak-hub/current/ps5/index.html
location = /ps5 {
    return 308 /ps5/$is_args$args;
}
location = /ps5/index.html {
    root /var/www/ps5-jailbreak-hub/current;
    add_header Cache-Control "no-cache";
}
location ^~ /ps5/assets/ {
    root /var/www/ps5-jailbreak-hub/shared;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location ^~ /ps5/ {
    root /var/www/ps5-jailbreak-hub/current;
    try_files $uri $uri/ /ps5/index.html;
    add_header Cache-Control "no-cache";
}
